name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Go tests
        run: go test ./...

      - name: Test website release automation
        run: node --test scripts/update-website-release.test.cjs

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e --prefix frontend

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  gui-build:
    name: GUI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build GUI
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 build -clean -tags production

      - name: Verify and package macOS ARM64 GUI
        if: runner.os == 'macOS'
        run: |
          lipo -verify_arch arm64 build/bin/HumbleBee.app/Contents/MacOS/HumbleBee
          ditto -c -k --sequesterRsrc --keepParent build/bin/HumbleBee.app "$RUNNER_TEMP/HumbleBee_GUI_ci_darwin_arm64.zip"
